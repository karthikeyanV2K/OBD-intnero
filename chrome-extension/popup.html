<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OverDrive Agent</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0e1a;
      color: #e2e8f0;
      padding: 16px;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .logo {
      width: 28px; height: 28px;
      background: linear-gradient(135deg, #22d3ee, #a78bfa);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      display: inline-block;
    }
    .connected { background: #22c55e; }
    .disconnected { background: #ef4444; }
    .status-text { color: #64748b; font-size: 12px; margin-left: auto; }
    textarea {
      width: 100%; min-height: 80px;
      background: #111827; border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px; padding: 10px;
      color: #e2e8f0; font-size: 13px;
      font-family: inherit; resize: vertical;
      outline: none;
    }
    textarea:focus { border-color: #22d3ee; }
    .btn {
      width: 100%; padding: 10px;
      border: none; border-radius: 8px;
      font-size: 13px; font-weight: 600;
      cursor: pointer; transition: opacity 0.15s;
      margin-top: 8px;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: linear-gradient(135deg, #22d3ee, #a78bfa); color: #fff; }
    .btn-secondary { background: #1a2235; color: #e2e8f0; border: 1px solid rgba(255,255,255,0.07); }
    .actions { display: flex; gap: 6px; margin-top: 10px; }
    .actions .btn { margin-top: 0; }
    .result {
      margin-top: 12px;
      background: #111827;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 8px;
      padding: 10px;
      font-size: 12px;
      max-height: 200px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
      display: none;
    }
    .result.show { display: block; }
    .result.error { border-color: rgba(239,68,68,0.3); color: #ef4444; }
    .model-select {
      width: 100%; padding: 8px 10px;
      background: #111827; border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px; color: #e2e8f0; font-size: 12px;
      outline: none; margin-top: 8px;
    }
    .label { color: #64748b; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">⚡</div>
    <span style="font-weight:600">OverDrive Agent</span>
    <span class="status-text">
      <span class="status-dot disconnected" id="statusDot"></span>
      <span id="statusLabel">Connecting...</span>
    </span>
  </div>

  <div class="label">Task</div>
  <textarea id="taskInput" placeholder="e.g. Explain this code, fix the bug, write a function..."></textarea>

  <div class="label">Model</div>
  <select class="model-select" id="modelSelect">
    <option value="claude-sonnet-4-6">Claude Sonnet 4.6</option>
    <option value="claude-opus-4-6">Claude Opus 4.6</option>
    <option value="gpt-4o">GPT-4o</option>
    <option value="gpt-4o-mini">GPT-4o Mini</option>
  </select>

  <button class="btn btn-primary" id="askBtn">⚡ Ask Agent</button>

  <div class="actions">
    <button class="btn btn-secondary" id="graphBtn" style="flex:1">📊 Graph</button>
    <button class="btn btn-secondary" id="statusBtn" style="flex:1">🔄 Refresh</button>
  </div>

  <div class="result" id="resultArea"></div>

  <script src="popup.js"></script>
</body>
</html>
